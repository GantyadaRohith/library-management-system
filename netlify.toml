[build]
  command = "cd netlify/functions && npm install && cd ../../client && npm install && chmod +x node_modules/.bin/react-scripts && npm run build"
  publish = "client/build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  CI = "false"

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/create-admin"
  to = "/.netlify/functions/create-admin"
  status = 200

[[redirects]]
  from = "/api/books/filters/options"
  to = "/.netlify/functions/get-filter-options"
  status = 200

[[redirects]]
  from = "/api/books"
  to = "/.netlify/functions/get-books"
  status = 200
  conditions = {methods = ["GET"]}

[[redirects]]
  from = "/api/books"
  to = "/.netlify/functions/add-book"
  status = 200
  conditions = {methods = ["POST"]}

[[redirects]]
  from = "/api/books/add"
  to = "/.netlify/functions/add-book"
  status = 200

[[redirects]]
  from = "/api/requests"
  to = "/.netlify/functions/get-requests"
  status = 200

[[redirects]]
  from = "/api/admin/overdue"
  to = "/.netlify/functions/get-overdue"
  status = 200

[[redirects]]
  from = "/api/books/*"
  to = "/.netlify/functions/books"
  status = 200

[[redirects]]
  from = "/api/requests/*"
  to = "/.netlify/functions/requests"
  status = 200

[[redirects]]
  from = "/api/admin/*"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"